security:
    # Hash seguro de contraseñas (Bcrypt / Argon2id automático)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Proveedor de usuarios desde PostgreSQL mediante Doctrine
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\ApiSecurityHandler
            access_denied_handler: App\Security\ApiSecurityHandler
            access_token:
                token_handler: App\Security\JwtAccessTokenHandler

        main:
            lazy: true
            provider: app_user_provider

    # Control de acceso por rutas (RBAC - Role-Based Access Control)
    access_control:
        # Rutas públicas de autenticación y documentación
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/status$, roles: PUBLIC_ACCESS }

        # Catálogo de productos: lectura requiere sesión (ROLE_USER), escritura solo ROLE_ADMIN
        - { path: ^/api/products, methods: [GET], roles: ROLE_USER }
        - { path: ^/api/products, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }

        # Gestión de usuarios: solo ROLE_ADMIN
        - { path: ^/api/users, roles: ROLE_ADMIN }

        # Pedidos y perfil: requieren usuario autenticado (JWT válido)
        - { path: ^/api/orders, roles: ROLE_USER }
        - { path: ^/api/me, roles: ROLE_USER }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
